version: '3.8'
services:
  web:
    image: nginx:stable-alpine
    container_name: nginx_demo
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - demo-net

networks:
  demo-net:
    driver: bridge
